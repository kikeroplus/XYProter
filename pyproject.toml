[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xyproter"
version = "0.1.0"
description = "XYプロッター用 日本語文字センターライン抽出パイプライン"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
]

[project.optional-dependencies]
preview = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]
hardware = ["pyserial>=3.5"]

[tool.setuptools.packages.find]
include = ["xyproter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
